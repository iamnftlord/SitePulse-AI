services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitepulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=30
      - ALLOW_PRIVATE_IPS=false
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sitepulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitepulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sitepulse-net

  # Optional local Ollama service for fully offline open-weight model synthesis
  ollama:
    image: ollama/ollama:latest
    container_name: sitepulse-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - sitepulse-net
    profiles:
      - with-ai

networks:
  sitepulse-net:
    driver: bridge

volumes:
  ollama-models:
